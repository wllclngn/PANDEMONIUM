[package]
name = "pandemonium"
version = "5.20.0"
edition = "2021"
description = "An adaptive sched_ext scheduler: CoDel sojourn ordering, effective-resistance distance pricing and knobs derived each second from measured per-CPU queue behaviour"
license = "GPL-2.0-only"

[dependencies]
libbpf-rs = { version = "=0.27.0", default-features = false }
libc = "0.2.175"
anyhow = "1.0.65"
clap = { version = "4.5.41", features = ["derive"] }
ctrlc = { version = "3.4.7", features = ["termination"] }
flate2 = "1.1.2"
regex = "1.11.2"

[build-dependencies]
libbpf-cargo = "=0.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
